name: Validate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain versions
        run: |
          xcodebuild -version
          python3 --version
      - name: App and release regressions
        env:
          # Hosted runners do not reliably support local multicast discovery.
          # Window receivers do not advertise; identity filtering and real
          # loopback TLS tests still run here.
          TEST_RUNNER_ALTVIEW_SKIP_BONJOUR_TEST: "1"
        run: make test
      - name: Project generator stays in sync
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- AltView.xcodeproj
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Release build
        run: >-
          xcodebuild -project AltView.xcodeproj -scheme AltView
          -configuration Release -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify universal release and built metadata
        run: |
          python3 - <<'PY'
          import plistlib
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release import verify_universal_app
          version = Path("VERSION").read_text().strip()
          for configuration in ("Debug", "Release"):
              app = Path("build/DerivedData/Build/Products") / configuration / "AltView.app"
              if configuration == "Release":
                  verify_universal_app(app)
              info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
              assert info["CFBundleShortVersionString"] == version
              assert info["LSMinimumSystemVersion"] == "12.0"
              assert info["SURequireSignedFeed"] is True
              assert info["SUVerifyUpdateBeforeExtraction"] is True
              assert info["SUAllowsAutomaticUpdates"] is False
              assert info["SUEnableInstallerLauncherService"] is True
              assert not info.get("SUEnableDownloaderService")
              print(f"{configuration}: AltView {version} with signed Sparkle updates")
          PY
